name = "finetunism"
main = "src/worker.js"
compatibility_date = "2026-08-30"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "Counter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Counter"]
